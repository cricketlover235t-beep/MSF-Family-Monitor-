name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project
        run: |
          ZIP_FILE=$(ls -1 | grep -i '^msf-family-monitor.*\.zip$' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No msf-family-monitor*.zip file found in repo root"
            ls -la
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          # اگر zip کے اندر ایک اور فولڈر ہو تو اسے سنبھالنا
          if [ ! -f project/settings.gradle ]; then
            INNER=$(dirname "$(find project -maxdepth 3 -name settings.gradle | head -n 1)")
            echo "PROJECT_DIR=$INNER" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Family-Monitor-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
